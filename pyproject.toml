[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert é o padrão nos testes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # senhas fixas de teste

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning:flask_limiter.*"]
