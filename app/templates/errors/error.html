{% extends "base.html" %}
{% import "components/ui.html" as ui with context %}

{% block content %}
<div class="container error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="actions">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Voltar ao início</a>
    <a class="btn btn-secondary" href="{{ url_for('main.search') }}">{{ ui.icon("search") }} Buscar</a>
  </div>
</div>
{% endblock %}
